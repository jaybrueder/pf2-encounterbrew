version: "2"

linters:
  enable:
    - govet
    - gocyclo
    - ineffassign
    - staticcheck
    - goconst
    - errcheck
    - gosec
    - misspell
  settings:
    gocyclo:
      min-complexity: 30
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: ^tests/
        linters:
          - goconst

run:
  timeout: 5m
